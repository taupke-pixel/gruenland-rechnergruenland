<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Grünland RF/NDF Rechner V6</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

input,
textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
}

button{
padding:10px;
margin-top:5px;
}

.cutCard{
background:#fafafa;
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="card">

<h2>Neuer Schnitt</h2>

<label>Jahr</label>
<input id="year" type="number" value="2026">

<label>Schnitt</label>
<input id="schnitt" type="number" value="1">

<label>Datum</label>
<input id="datum" type="date">

<label>TM-Ertrag (t/ha)</label>
<input id="tm" type="number" step="0.01">

<label>RP Feld (%)</label>
<input id="rpField" type="number" step="0.01">

<label>Notiz</label>
<textarea id="note"></textarea>

<button onclick="addCut()">
Schnitt speichern
</button>

</div>

<div class="card">
<h2>Aktive Formel</h2>
<div id="formulaContainer"></div>
</div>

<div class="card">
<h2>Statistik</h2>
<div id="statsContainer"></div>
</div>

<div class="card">
<h2>Formelverlauf</h2>
<div id="historyContainer"></div>
</div>

<div class="card">
<h2>Gespeicherte Schnitte</h2>
<div id="cutsContainer"></div>
</div>

<script>
const STORAGE_KEY = "gruenland_v6";

const START_FORMULA = {

    rfBase:31.5,
    rfRp:-0.65,
    rfTm:0.15,
    rfSchnitt:0,
    rfMonat:0,

    ndfBase:48,
    ndfRp:-0.80,
    ndfTm:0.25,
    ndfSchnitt:0,
    ndfMonat:0

};

let data = {

    cuts:[],

    history:[],

    activeFormula:"Startformel",

    formula:{...START_FORMULA}

};

function loadData(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(saved){

        try{

            data =
                JSON.parse(
                    saved
                );

        }
        catch(e){

            console.log(
                "Fehler beim Laden"
            );

        }

    }

}

function saveData(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
            data
        )

    );

}
function addCut(){

    const year =
        Number(
            document
            .getElementById("year")
            .value
        );

    const schnitt =
        Number(
            document
            .getElementById("schnitt")
            .value
        );

    const datum =
        document
        .getElementById("datum")
        .value;

    const tm =
        Number(
            document
            .getElementById("tm")
            .value
        );

    const rpField =
        Number(
            document
            .getElementById("rpField")
            .value
        );

    const note =
        document
        .getElementById("note")
        .value;

    if(
        !datum ||
        !tm ||
        !rpField
    ){

        alert(
            "Datum, TM und RP Feld eingeben"
        );

        return;

    }

    const monat =
        Number(
            datum.split("-")[1]
        );

    const cut = {

        id:Date.now(),

        year,

        schnitt,

        datum,

        monat,

        tm,

        rpField,

        rpLabor:null,

        rfLabor:null,

        ndfLabor:null,

        rpLoss:null,

        rpEstimate:null,

        rfEstimate:null,

        ndfEstimate:null,

        note,

        calibrated:false,

        created:
            new Date()
            .toISOString(),

        modified:
            new Date()
            .toISOString()

    };

    data.cuts.unshift(
        cut
    );

    saveData();

    render();

}

function deleteCut(id){

    if(
        !confirm(
            "Schnitt löschen?"
        )
    ){
        return;
    }

    data.cuts =
        data.cuts.filter(
            c => c.id !== id
        );

    saveData();

    render();

}

function editCut(id){

    const cut =
        data.cuts.find(
            c => c.id === id
        );

    if(!cut){
        return;
    }

    cut.editMode = true;

    render();

}
    function saveEdit(id){

    const cut =
        data.cuts.find(
            c => c.id === id
        );

    if(!cut){
        return;
    }

    cut.datum =
        document
        .getElementById(
            "editDatum_" + id
        ).value;

    cut.monat =
        Number(
            cut.datum.split("-")[1]
        );

    cut.tm =
        Number(
            document
            .getElementById(
                "editTm_" + id
            ).value
        );

    cut.rpField =
        Number(
            document
            .getElementById(
                "editRp_" + id
            ).value
        );

    cut.note =
        document
        .getElementById(
            "editNote_" + id
        ).value;

    cut.editMode = false;

    recalculateModels();

    saveData();

    render();

}

function cancelEdit(id){

    const cut =
        data.cuts.find(
            c => c.id === id
        );

    if(!cut){
        return;
    }

    cut.editMode = false;

    render();

}

   

function saveLabor(id){

    const cut =
        data.cuts.find(
            c => c.id === id
        );

    if(!cut){
        return;
    }

    const rpLabor =
        Number(
            document
            .getElementById(
                "rpLabor_" + id
            ).value
        );

    const rfLabor =
        Number(
            document
            .getElementById(
                "rfLabor_" + id
            ).value
        );

    const ndfLabor =
        Number(
            document
            .getElementById(
                "ndfLabor_" + id
            ).value
        );

    if(
        !rpLabor ||
        !rfLabor ||
        !ndfLabor
    ){

        alert(
            "Alle Laborwerte eingeben"
        );

        return;

    }

    cut.rpLabor =
        rpLabor;

    cut.rfLabor =
        rfLabor;

    cut.ndfLabor =
        ndfLabor;

    cut.rpLoss =
        Number(
            (
                cut.rpField -
                cut.rpLabor
            ).toFixed(2)
        );

   cut.calibrated =
    true;

cut.modified =
    new Date()
    .toISOString();

recalculateModels();

saveData();

render();

}
function solveLinearSystem(A,b){

    const n = A.length;

    for(let i=0;i<n;i++){

        let max=i;

        for(let k=i+1;k<n;k++){

            if(
                Math.abs(A[k][i]) >
                Math.abs(A[max][i])
            ){
                max=k;
            }

        }

        [A[i],A[max]] =
        [A[max],A[i]];

        [b[i],b[max]] =
        [b[max],b[i]];

        const pivot =
            A[i][i];

        if(
            Math.abs(pivot)
            < 0.0000001
        ){
            return null;
        }

        for(let j=i;j<n;j++){

            A[i][j] /= pivot;

        }

        b[i] /= pivot;

        for(let k=0;k<n;k++){

            if(k===i){
                continue;
            }

            const factor =
                A[k][i];

            for(let j=i;j<n;j++){

                A[k][j] -=
                    factor *
                    A[i][j];

            }

            b[k] -=
                factor *
                b[i];

        }

    }

    return b;

}

function buildRegression(target){

    const rows =
        data.cuts.filter(
            c =>
                c.calibrated &&
                c.rpLabor !== null
        );

    if(
        rows.length < 10
    ){
        return null;
    }

    const vars = 5;

    let xtx =
        Array(vars)
        .fill(0)
        .map(() =>
            Array(vars)
            .fill(0)
        );

    let xty =
        Array(vars)
        .fill(0);

    rows.forEach(c => {

        const x = [

            1,

            c.rpLabor,

            c.tm,

            c.schnitt,

            c.monat

        ];

        let y = 0;

        if(target==="rf"){
            y = c.rfLabor;
        }

        if(target==="ndf"){
            y = c.ndfLabor;
        }

        if(target==="rp"){
            y = c.rpLabor;
        }

        for(let i=0;i<vars;i++){

            xty[i] +=
                x[i] * y;

            for(let j=0;j<vars;j++){

                xtx[i][j] +=
                    x[i] * x[j];

            }

        }

    });

    return solveLinearSystem(
        xtx,
        xty
    );

}

function recalculateModels(){

    const rf =
        buildRegression(
            "rf"
        );

    const ndf =
        buildRegression(
            "ndf"
        );

    if(
        rf &&
        ndf
    ){

        data.formula = {

            rfBase:rf[0],
            rfRp:rf[1],
            rfTm:rf[2],
            rfSchnitt:rf[3],
            rfMonat:rf[4],

            ndfBase:ndf[0],
            ndfRp:ndf[1],
            ndfTm:ndf[2],
            ndfSchnitt:ndf[3],
            ndfMonat:ndf[4]

        };

        data.activeFormula =
            "Betriebsformel";

    }
    else{

        data.formula = {
            ...START_FORMULA
        };

        data.activeFormula =
            "Startformel";

    }

    updateHistory();

}

function updateHistory(){

    const text =

        "RF = " +

        data.formula.rfBase
        .toFixed(3) +

        " + (" +

        data.formula.rfRp
        .toFixed(3) +

        " × RP) + (" +

        data.formula.rfTm
        .toFixed(3) +

        " × TM) + (" +

        data.formula.rfSchnitt
        .toFixed(3) +

        " × Schnitt) + (" +

        data.formula.rfMonat
        .toFixed(3) +

        " × Monat)";

    const last =
        data.history[0];

    if(
        !last ||
        last.formula !== text
    ){

        data.history.unshift({

            date:
                new Date()
                .toLocaleString(),

            formula:text

        });

    }

}
 function estimateRPLabor(cut){

    const calibrated =
        data.cuts.filter(
            c =>
                c.calibrated &&
                c.rpLabor !== null
        );

    if(
        calibrated.length < 5
    ){

        return Number(
            (
                cut.rpField - 1
            ).toFixed(2)
        );

    }

    let avgLoss = 0;

    calibrated.forEach(c => {

        avgLoss +=
            c.rpLoss;

    });

    avgLoss =
        avgLoss /
        calibrated.length;

    return Number(
        (
            cut.rpField -
            avgLoss
        ).toFixed(2)
    );

}

function estimateRF(cut){

    const rpLabor =
        estimateRPLabor(
            cut
        );

    return Number(

        (

            data.formula.rfBase +

            data.formula.rfRp *
            rpLabor +

            data.formula.rfTm *
            cut.tm +

            data.formula.rfSchnitt *
            cut.schnitt +

            data.formula.rfMonat *
            cut.monat

        )

        .toFixed(2)

    );

}

function estimateNDF(cut){

    const rpLabor =
        estimateRPLabor(
            cut
        );

    return Number(

        (

            data.formula.ndfBase +

            data.formula.ndfRp *
            rpLabor +

            data.formula.ndfTm *
            cut.tm +

            data.formula.ndfSchnitt *
            cut.schnitt +

            data.formula.ndfMonat *
            cut.monat

        )

        .toFixed(2)

    );

}

function updateAllEstimates(){

    data.cuts.forEach(c => {

        c.rpEstimate =
            estimateRPLabor(c);

        c.rfEstimate =
            estimateRF(c);

        c.ndfEstimate =
            estimateNDF(c);

    });

}

function getStatistics(){

    const calibrated =
        data.cuts.filter(
            c => c.calibrated
        );

    let rpLoss = 0;
    let rfError = 0;
    let ndfError = 0;

    calibrated.forEach(c => {

        rpLoss +=
            c.rpLoss;

        rfError +=
            Math.abs(
                c.rfLabor -
                c.rfEstimate
            );

        ndfError +=
            Math.abs(
                c.ndfLabor -
                c.ndfEstimate
            );

    });

    return {

        cuts:
            data.cuts.length,

        calibrated:
            calibrated.length,

        avgLoss:

            calibrated.length

            ?

            (
                rpLoss /
                calibrated.length
            )

            : 0,

        avgRF:

            calibrated.length

            ?

            (
                rfError /
                calibrated.length
            )

            : 0,

        avgNDF:

            calibrated.length

            ?

            (
                ndfError /
                calibrated.length
            )

            : 0

    };

} 
function renderFormula(){

    const el =
        document.getElementById(
            "formulaContainer"
        );

    if(!el){
        return;
    }

    el.innerHTML =

    `
    <b>
    ${data.activeFormula}
    </b>

    <br><br>

    RF =
    ${data.formula.rfBase.toFixed(3)}
    +
    (${data.formula.rfRp.toFixed(3)} × RP)
    +
    (${data.formula.rfTm.toFixed(3)} × TM)
    +
    (${data.formula.rfSchnitt.toFixed(3)} × Schnitt)
    +
    (${data.formula.rfMonat.toFixed(3)} × Monat)

    <br><br>

    NDF =
    ${data.formula.ndfBase.toFixed(3)}
    +
    (${data.formula.ndfRp.toFixed(3)} × RP)
    +
    (${data.formula.ndfTm.toFixed(3)} × TM)
    +
    (${data.formula.ndfSchnitt.toFixed(3)} × Schnitt)
    +
    (${data.formula.ndfMonat.toFixed(3)} × Monat)
    `;

}

function renderStats(){

    const stats =
        getStatistics();

    const el =
        document.getElementById(
            "statsContainer"
        );

    if(!el){
        return;
    }

    el.innerHTML =

    `
    <div>
    Schnitte:
    ${stats.cuts}
    </div>

    <div>
    Kalibriert:
    ${stats.calibrated}
    </div>

    <div>
    Ø RP Verlust:
    ${stats.avgLoss.toFixed(2)}
    </div>

    <div>
    Ø RF Fehler:
    ${stats.avgRF.toFixed(2)}
    </div>

    <div>
    Ø NDF Fehler:
    ${stats.avgNDF.toFixed(2)}
    </div>
    `;

}

function renderHistory(){

    const el =
        document.getElementById(
            "historyContainer"
        );

    if(!el){
        return;
    }

    el.innerHTML =

        data.history

        .slice(0,100)

        .map(h =>

        `
        <div class="cutCard">

        <b>
        ${h.date}
        </b>

        <br><br>

        ${h.formula}

        </div>
        `

        )

        .join("");

}

function renderCuts(){

    const el = document.getElementById("cutsContainer");

    if(!el) return;

    let html = "";

    data.cuts.forEach(c => {

        html += `
        <div class="cutCard">

        <b>${c.year} - ${c.schnitt}. Schnitt</b><br><br>

        Datum: ${c.datum}<br>
        TM: ${c.tm}<br>
        RP Feld: ${c.rpField}<br>
        RP Schätzung: ${c.rpEstimate ?? "-"}<br>
        RF Schätzung: ${c.rfEstimate ?? "-"}<br>
        NDF Schätzung: ${c.ndfEstimate ?? "-"}<br><br>
        `;

      if(c.editMode){

    html += `

    Datum
    <input
    id="editDatum_${c.id}"
    type="date"
    value="${c.datum}">

    TM
    <input
    id="editTm_${c.id}"
    type="number"
    step="0.01"
    value="${c.tm}">

    RP Feld
    <input
    id="editRp_${c.id}"
    type="number"
    step="0.01"
    value="${c.rpField}">

    Notiz
    <textarea
    id="editNote_${c.id}">${c.note || ""}</textarea>

    <button
    onclick="saveEdit(${c.id})">

    Speichern

    </button>

    <button
    onclick="cancelEdit(${c.id})">

    Abbrechen

    </button>

    `;

}
else if(c.calibrated){

    html += `

    RP Labor: ${c.rpLabor}<br>
    RF Labor: ${c.rfLabor}<br>
    NDF Labor: ${c.ndfLabor}<br>
    RP Verlust: ${c.rpLoss}<br><br>

    `;

}
else{

    html += `
    RP Labor
    <input id="rpLabor_${c.id}" type="number" step="0.01">

    RF Labor
    <input id="rfLabor_${c.id}" type="number" step="0.01">

    NDF Labor
    <input id="ndfLabor_${c.id}" type="number" step="0.01">

    <button onclick="saveLabor(${c.id})">
    Labor speichern
    </button><br><br>
    `;
}

        html += `
        ${c.note || ""}<br><br>

        <button onclick="editCut(${c.id})">
        Bearbeiten
        </button>

        <button onclick="deleteCut(${c.id})">
        Löschen
        </button>

        </div>
        `;
    });

    el.innerHTML = html;

}
 

function render(){

    updateAllEstimates();

    renderFormula();

    renderStats();

    renderHistory();

    renderCuts();

}

loadData();

updateAllEstimates();

render();

saveData();  
    </script>

</body>
</html>
